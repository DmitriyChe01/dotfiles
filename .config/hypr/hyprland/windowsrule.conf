##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$


# Pqiv img viewer
windowrulev2 = fullscreen,class:(Pqiv)
# vlc video viewer

windowrulev2 = float,class:(vlc)
windowrulev2 = move 25% 25%,class:(vlc)
windowrulev2 = size 50% 50%, class:(vlc)

windowrulev2 = float,class:(org.pulseaudio.pavucontrol)
windowrulev2 = move 70% 5%,class:(org.pulseaudio.pavucontrol)

windowrulev2 = float,title:(overskride)
windowrulev2 = move 25% 5%,title:(overskride)

windowrulev2 = float, class:(com.github.hluk.copyq)
windowrulev2 = size 40% 90%, class:(com.github.hluk.copyq)

windowrulev2 = workspace 1 silent,class:(zen) 
windowrulev2 = workspace 3 silent,class:(org.telegram.desktop)
windowrulev2 = workspace 4 silent,class:(obsidian)
workspace = 1,monitor:HDMI-A-2
workspace = 2,monitor:HDMI-A-2
workspace = 3,monitor:HDMI-A-2
workspace = 4,monitor:HDMI-A-2
workspace = 5,monitor:HDMI-A-2
workspace = 6,monitor:HDMI-A-2
workspace = 7,monitor:HDMI-A-2
workspace = 8,monitor:HDMI-A-2

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

